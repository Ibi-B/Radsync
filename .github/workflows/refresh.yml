name: Refresh radio catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: radsync-state
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Radsync main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore durable provider snapshots
        id: state_checkout
        uses: actions/checkout@v4
        with:
          ref: radsync-state
          path: state
          fetch-depth: 1
          persist-credentials: true

      # The state branch may contain a report from an earlier run. Clear it
      # before any setup/test step so an early failure cannot upload stale data.
      - name: Clear previous refresh report
        id: clear_previous_refresh_report
        run: mkdir -p state/diagnostics && rm -f state/diagnostics/source-report.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Restore externally stored provider snapshots
        env:
          RADSYNC_S3_BUCKET: ${{ vars.RADSYNC_S3_BUCKET }}
          RADSYNC_S3_ENDPOINT: ${{ vars.RADSYNC_S3_ENDPOINT }}
          RADSYNC_S3_REGION: ${{ vars.RADSYNC_S3_REGION }}
          RADSYNC_S3_PREFIX: ${{ vars.RADSYNC_S3_PREFIX }}
          RADSYNC_DIAGNOSTICS_PREFIX: ${{ vars.RADSYNC_DIAGNOSTICS_PREFIX }}
          RADSYNC_S3_ACCESS_KEY_ID: ${{ secrets.RADSYNC_S3_ACCESS_KEY_ID }}
          RADSYNC_S3_SECRET_ACCESS_KEY: ${{ secrets.RADSYNC_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Retry any post-push rotation cleanup left by an interrupted prior run.
          python -m sources.state_cli finalize-external --state-dir state --manifest-pushed
          git -C state config user.name "github-actions[bot]"
          git -C state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C state add --all -- manifests/providers
          if ! git -C state diff --cached --quiet; then
            git -C state commit -m "Finalize prior Radsync snapshot rotation"
            git -C state push origin HEAD:refs/heads/radsync-state
          fi
          python -m sources.state_cli restore-external --state-dir state --config config/sources.json

      - name: Validate restored provider state
        id: validate_state
        run: python -m sources.state_cli validate --state-dir state

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Capture previous published station index
        id: previous_catalogue
        env:
          PAGES_URL: ${{ vars.RADSYNC_PAGES_URL }}
        run: |
          set -euo pipefail
          mkdir -p continuity
          if [ -z "${PAGES_URL:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "RADSYNC_PAGES_URL is not configured; identity continuity report will be skipped."
            exit 0
          fi
          if python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          base = os.environ["PAGES_URL"].rstrip("/")
          with urlopen(base + "/current/master-index.json", timeout=30) as response:
              pointer = json.load(response)
          master_path = pointer["masterIndex"].lstrip("/")
          with urlopen(base + "/" + master_path, timeout=30) as response:
              master = json.load(response)
          version_prefix = pointer["masterIndex"].rsplit("/", 1)[0]
          stations_path = master["stationsUrl"].lstrip("/")
          with urlopen(base + "/" + version_prefix + "/" + stations_path, timeout=30) as response:
              stations = json.load(response)
          if not isinstance(stations.get("stations"), list) or not stations["stations"]:
              raise ValueError("Previous station index is empty or invalid")
          Path("continuity/previous-stations.json").write_text(json.dumps(stations), encoding="utf-8")
          Path("continuity/previous-version.txt").write_text(str(pointer["version"]), encoding="utf-8")
          PY
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not capture the previous catalogue; continuity reporting is skipped for this run."
          fi

      - name: Build catalogue using fresh or last-good provider data
        id: build_catalogue
        run: python -m scripts.build_radio_catalog --state-dir state

      - name: Validate published catalogue
        if: ${{ steps.build_catalogue.outcome == 'success' }}
        run: python scripts/validate_catalog.py

      - name: Generate station identity continuity report
        if: ${{ steps.build_catalogue.outcome == 'success' && steps.previous_catalogue.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(python -c 'import json; from pathlib import Path; p=json.loads(Path("output/current/master-index.json").read_text()); print(p["version"])')"
          CURRENT_MASTER="$(python -c 'import json; from pathlib import Path; p=json.loads(Path("output/current/master-index.json").read_text()); print(p["masterIndex"])')"
          CURRENT_STATIONS="$(python -c 'import json; from pathlib import Path; p=json.loads(Path("output/$CURRENT_MASTER").read_text()); print("output/" + "$CURRENT_MASTER".rsplit("/", 1)[0] + "/" + p["stationsUrl"])')"
          python -m scripts.station_identity_continuity \
            --previous continuity/previous-stations.json \
            --current "$CURRENT_STATIONS" \
            --output state/identity-continuity/"$CURRENT_VERSION".json
          python -c 'import json,sys; p=json.load(open(sys.argv[1])); print(json.dumps({k:p[k] for k in ("previousVersion","currentVersion","retained","changed","removed","added","ambiguousPrevious","ambiguousCurrent")}, indent=2))' \
            state/identity-continuity/"$CURRENT_VERSION".json

      - name: Persist externally verified provider snapshots
        if: ${{ always() && steps.state_checkout.outcome == 'success' && steps.validate_state.outcome == 'success' && steps.build_catalogue.outcome != 'skipped' }}
        env:
          RADSYNC_S3_BUCKET: ${{ vars.RADSYNC_S3_BUCKET }}
          RADSYNC_S3_ENDPOINT: ${{ vars.RADSYNC_S3_ENDPOINT }}
          RADSYNC_S3_REGION: ${{ vars.RADSYNC_S3_REGION }}
          RADSYNC_S3_PREFIX: ${{ vars.RADSYNC_S3_PREFIX }}
          RADSYNC_DIAGNOSTICS_PREFIX: ${{ vars.RADSYNC_DIAGNOSTICS_PREFIX }}
          RADSYNC_S3_ACCESS_KEY_ID: ${{ secrets.RADSYNC_S3_ACCESS_KEY_ID }}
          RADSYNC_S3_SECRET_ACCESS_KEY: ${{ secrets.RADSYNC_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ ! -f state/diagnostics/source-report.json ]; then
            echo "No current-run refresh report was produced; preserving the previous provider state."
            exit 0
          fi
          python -m sources.state_cli validate --state-dir state

          if [ -z "${RADSYNC_S3_BUCKET:-}" ]; then
            if compgen -G "state/manifests/providers/*.json" > /dev/null; then
              echo "::error::External provider manifests exist but RADSYNC_S3_BUCKET is not configured."
              exit 1
            fi
            echo "::warning::External snapshot storage is not configured; provider state was not advanced."
            exit 0
          fi

          python -m sources.state_cli publish-external \
            --state-dir state \
            --config config/sources.json \
            --report state/diagnostics/source-report.json \
            --ambiguity state/diagnostics/identity-ambiguity.json \
            --run-id "$GITHUB_RUN_ID"

          # The external objects and manifests have been verified. Keep only
          # small pointers in Git; the large report remains for artifact upload.
          git -C state config user.name "github-actions[bot]"
          git -C state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C state rm --cached -f diagnostics/source-report.json diagnostics/identity-ambiguity.json >/dev/null 2>&1 || true
          git -C state add --all -- . \
            ':(exclude)diagnostics/source-report.json' \
            ':(exclude)diagnostics/identity-ambiguity.json'
          if git -C state diff --cached --quiet; then
            echo "No external manifest or diagnostic changes to persist."
          else
            git -C state commit -m "Persist external Radsync snapshot manifests for run ${GITHUB_RUN_ID}"
            git -C state push origin HEAD:refs/heads/radsync-state
          fi

          # Only after the manifest commit is remote may superseded objects be
          # removed from current/previous. Every replacement was verified first.
          python -m sources.state_cli finalize-external --state-dir state --manifest-pushed
          git -C state add --all -- manifests/providers
          if ! git -C state diff --cached --quiet; then
            git -C state commit -m "Finalize Radsync snapshot rotation for run ${GITHUB_RUN_ID}"
            git -C state push origin HEAD:refs/heads/radsync-state
          fi
      - name: Upload identity ambiguity diagnostics
        if: ${{ always() && steps.state_checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: identity-ambiguity-${{ github.run_id }}
          path: state/diagnostics/identity-ambiguity.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload refresh report
        if: ${{ always() && steps.state_checkout.outcome == 'success' && steps.build_catalogue.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report-${{ github.run_id }}
          path: state/diagnostics/source-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Pages artifact
        if: ${{ steps.build_catalogue.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy radio catalogue
        id: deployment
        uses: actions/deploy-pages@v4
